<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wardrobe Lookbook</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  /* Layout: full-viewport masthead over a fixed 1fr/2fr split — controls left,
     a single image plate right; page never scrolls.
     Type: Bodoni Moda (masthead, folio, plate no.) + Archivo (controls, data).
     Palette: gallery warm-grey paper, warm ink, greige mat, oxblood accent. */
  :root {
    --paper: #F4F3EF;
    --ink: #1C1A17;
    --mat: #E7E4DC;
    --line: #D4D0C6;
    --muted: #726D63;
    --accent: #6E2433;
    --accent-soft: rgba(110,36,51,.10);
    --c-locked: #3F7D5A;
    --c-potential: #937327;
    --c-doubtful: #A4505B;
    --c-custom: #4A6FA5;
    --shadow: 0 2px 26px rgba(28,26,23,.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #191816; --ink: #ECE8E0; --mat: #221F1C; --line: #35312B;
      --muted: #9C968A; --accent: #CB7F89; --accent-soft: rgba(203,127,137,.16);
      --c-locked: #6FB890; --c-potential: #D6B45E; --c-doubtful: #D98791; --c-custom: #86A6D6;
      --shadow: 0 2px 30px rgba(0,0,0,.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #191816; --ink: #ECE8E0; --mat: #221F1C; --line: #35312B;
    --muted: #9C968A; --accent: #CB7F89; --accent-soft: rgba(203,127,137,.16);
    --c-locked: #6FB890; --c-potential: #D6B45E; --c-doubtful: #D98791; --c-custom: #86A6D6;
    --shadow: 0 2px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }
  .app { height: 100%; display: flex; flex-direction: column; }

  /* ---- masthead ---- */
  .masthead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding-block: 13px;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line); flex: none;
  }
  .mast-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .wordmark {
    font-family: "Bodoni Moda", Georgia, serif; font-weight: 500; font-size: 29px;
    line-height: 1; margin: 0; letter-spacing: .01em;
  }
  .tagline { font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-size: 14px; color: var(--muted); }
  .mast-right { display: flex; align-items: center; gap: 14px; flex: none; }
  .folio {
    font-family: "Bodoni Moda", Georgia, serif; font-size: 15px; color: var(--muted);
    letter-spacing: .06em; font-variant-numeric: tabular-nums;
  }
  .theme {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; font-size: 14px; line-height: 1;
  }
  .theme:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- split ---- */
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(360px, 1.1fr) 1.9fr; }

  /* ---- controls panel ---- */
  .panel { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .panel-scroll {
    flex: 1; min-height: 0; overflow: auto;
    padding-block: 20px;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: 24px;
  }
  .search input {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line);
    color: var(--ink); font: inherit; font-size: 14px; padding: 10px 0; margin-bottom: 18px;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-bottom-color: var(--accent); }

  .cats { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .cats button {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 6px 15px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .cats button:hover { border-color: var(--accent); color: var(--accent); }
  .cats button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* "+ Add outfit" — opens the custom-outfit form */
  .addbtn {
    width: 100%; margin: 10px 0 2px; padding: 9px 14px; border: 1px dashed var(--line);
    background: transparent; color: var(--muted); border-radius: 10px; font: inherit;
    font-size: 13px; cursor: pointer; transition: color .12s, border-color .12s;
  }
  .addbtn:hover { border-color: var(--accent); color: var(--accent); }

  .grp {
    font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-size: 19px;
    color: var(--ink); margin: 22px 0 2px;
  }
  .row {
    display: grid; grid-template-columns: 18px 66px 1fr auto auto; align-items: center;
    gap: 9px; padding-block: 12px; border-bottom: 1px solid var(--line);
  }
  .row.is-locked { background: var(--accent-soft); border-radius: 6px; }
  .rowacts { display: flex; gap: 1px; justify-self: end; }
  .rowacts button {
    width: 23px; height: 23px; padding: 0; border: none; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1; border-radius: 6px;
    opacity: .5; transition: color .12s, opacity .12s;
  }
  .rowacts button:hover { opacity: 1; color: var(--accent); }
  .rowacts button.on { opacity: 1; }
  .rowacts .wishbtn.on { color: var(--accent); }
  .rowacts .ownbtn.on { color: var(--c-locked); }
  .rowacts .lockbtn.on { color: var(--accent); }
  .dot { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(128,128,128,.35); }
  .row label { font-size: 14px; color: var(--ink); }
  .sel { position: relative; min-width: 0; }
  .sel::after {
    content: "▾"; position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    font-size: 10px; color: var(--muted); pointer-events: none;
  }
  .sel select {
    width: 100%; appearance: none; -webkit-appearance: none; background: transparent;
    border: none; color: var(--ink); font: inherit; font-size: 14px; font-weight: 500;
    padding: 2px 16px 2px 0; cursor: pointer; border-radius: 3px;
  }
  .sel select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hex {
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
    text-align: right; white-space: nowrap;
  }
  /* pattern controls: a second line under a pattern-capable row (e.g. Shirt) */
  .patline { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding-top: 10px; }
  .patlabel {
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .09em;
  }
  .sel-pat { min-width: 118px; flex: none; }
  .patacc {
    width: 22px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 50%;
    background: none; cursor: pointer; transition: opacity .12s;
  }
  .patacc::-webkit-color-swatch-wrapper { padding: 0; }
  .patacc::-webkit-color-swatch { border: none; border-radius: 50%; }
  .patacc::-moz-color-swatch { border: none; border-radius: 50%; }
  .patacc:disabled { cursor: default; }
  .patname {
    flex: 1; min-width: 0; background: transparent; border: none;
    border-bottom: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 13px;
    padding: 2px 0; transition: opacity .12s, border-color .12s;
  }
  .patname::placeholder { color: var(--muted); }
  .patname:focus-visible { outline: none; border-bottom-color: var(--accent); }
  .patname:disabled { cursor: default; }

  /* ---- stepper ---- */
  .stepper {
    flex: none; border-top: 1px solid var(--line); display: flex; align-items: center;
    justify-content: space-between; gap: 10px;
    padding-block: 12px;
    padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: 24px;
  }
  .stepper button {
    background: transparent; border: 1px solid var(--line); color: var(--ink);
    padding: 8px 17px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .stepper button:hover { border-color: var(--accent); color: var(--accent); }
  .count {
    font-family: "Bodoni Moda", Georgia, serif; font-size: 19px; letter-spacing: .04em;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }

  /* ---- image plate ---- */
  .plate {
    min-height: 0; position: relative; display: flex; flex-direction: column;
    /* pool of the outfit's backdrop tone, strong near the figure, easing to the mat at the corners */
    background:
      radial-gradient(140% 115% at 50% 40%,
        color-mix(in srgb, var(--amb, var(--mat)) 92%, var(--mat)) 0%,
        color-mix(in srgb, var(--amb, var(--mat)) 68%, var(--mat)) 50%,
        color-mix(in srgb, var(--amb, var(--mat)) 28%, var(--mat)) 88%,
        var(--mat) 100%);
    transition: background .45s ease;
  }
  .stage {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: 20px; position: relative;
  }
  /* fixed 2:3 frame; image contained (never cropped), edges just lightly softened — not a glow */
  .stage img {
    height: 100%; aspect-ratio: 2 / 3; max-width: 100%; object-fit: contain; display: block;
    --feather: 0.5%;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0, #000 var(--feather), #000 calc(100% - var(--feather)), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 var(--feather), #000 calc(100% - var(--feather)), transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0, #000 var(--feather), #000 calc(100% - var(--feather)), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 var(--feather), #000 calc(100% - var(--feather)), transparent 100%);
    mask-composite: intersect;
    transition: opacity .22s ease;
  }
  .empty {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: var(--muted); font-style: italic; font-family: "Bodoni Moda", Georgia, serif; font-size: 18px;
  }
  .plate.is-empty .empty { display: flex; }
  .plate.is-empty img { visibility: hidden; }

  .caption {
    flex: none; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    border-top: 1px solid var(--line); background: var(--paper);
    padding-block: 14px;
    padding-left: 26px; padding-right: max(26px, env(safe-area-inset-right, 0px));
  }
  .plate-no {
    font-family: "Bodoni Moda", Georgia, serif; font-size: 23px; color: var(--accent);
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .cat-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .cat-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .cat-pill.is-Locked::before { background: var(--c-locked); }
  .cat-pill.is-Potential::before { background: var(--c-potential); }
  .cat-pill.is-Doubtful::before { background: var(--c-doubtful); }
  .cat-pill.is-Custom::before { background: var(--c-custom); }
  .alt-tag { display: none; font-style: italic; }

  /* caption affordances shown only for user-created outfits */
  .mark.edit, .mark.del { display: none; }
  .mark.del:hover { color: var(--c-doubtful); border-color: var(--c-doubtful); }

  /* ---- color card: the plate visual for a custom outfit with no photo ---- */
  .swatchcard {
    display: none; height: 100%; aspect-ratio: 2 / 3; max-width: 100%;
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
    box-shadow: var(--shadow); padding: 26px; flex-direction: column; justify-content: center; gap: 2px;
  }
  .plate.is-card .swatchcard { display: flex; }
  .plate.is-card img { display: none; }
  .sc-row { display: flex; align-items: center; gap: 14px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
  .sc-row:last-child { border-bottom: none; }
  .sc-sw { width: 30px; height: 30px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(128,128,128,.4); }
  .sc-slot { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); width: 66px; flex: none; }
  .sc-name { font-family: "Bodoni Moda", Georgia, serif; font-size: 20px; color: var(--ink); }
  .sc-div { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }

  /* ---- add / edit outfit modal ---- */
  .modal {
    display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center;
    background: rgba(28,26,23,.46); padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    width: min(540px, 100%); max-height: 90vh; overflow: auto; padding: 22px 24px;
  }
  .modal-title { font-family: "Bodoni Moda", Georgia, serif; font-size: 25px; margin: 0 0 14px; }
  .mf-row { display: grid; grid-template-columns: 74px 1fr 92px 30px; align-items: center; gap: 10px; padding: 7px 0; }
  .mf-hex {
    min-width: 0; width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line);
    color: var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
    padding: 4px 0; text-transform: lowercase;
  }
  .mf-hex::placeholder { color: var(--muted); text-transform: none; }
  .mf-hex:focus-visible { outline: none; border-bottom-color: var(--accent); }
  .mf-sub .mf-hex { flex: 0 0 82px; }
  .mf-row label { font-size: 13px; color: var(--ink); }
  .mf-row input[type="text"] {
    min-width: 0; background: transparent; border: none; border-bottom: 1px solid var(--line);
    color: var(--ink); font: inherit; font-size: 14px; padding: 4px 0;
  }
  .mf-row input[type="text"]:focus-visible { outline: none; border-bottom-color: var(--accent); }
  .mf-row input[type="color"] {
    width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px;
    background: none; cursor: pointer; justify-self: end;
  }
  .mf-sub { display: flex; align-items: center; gap: 10px; padding: 6px 0 2px; }
  .mf-sub .sel { min-width: 118px; flex: none; }
  .mf-div { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 16px 0 2px; border-top: 1px solid var(--line); padding-top: 12px; }
  .mf-photo { display: flex; align-items: center; gap: 12px; margin: 14px 0 4px; }
  .mf-photo img { width: 52px; height: 78px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); display: none; }
  .mf-photo img.on { display: block; }
  .mf-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .mf-actions button {
    border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 13px;
    padding: 8px 18px; border-radius: 999px; cursor: pointer; transition: color .12s, border-color .12s, background .12s;
  }
  .mf-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .mf-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mf-actions button.primary:hover { color: #fff; opacity: .92; }
  .mf-err { color: var(--c-doubtful); font-size: 12px; min-height: 15px; margin-top: 6px; }
  .alt-tag.on { display: inline-flex; }
  .descr { color: var(--muted); font-size: 13px; }

  /* image-fit toggle: Fit (framed on pool) vs Fill (full-bleed magazine) */
  .viewtoggle {
    position: absolute; top: 14px; z-index: 3; display: flex; gap: 3px; padding: 3px;
    right: max(14px, env(safe-area-inset-right, 0px)); border-radius: 999px;
    background: color-mix(in srgb, var(--paper) 70%, transparent);
    border: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  .viewtoggle button {
    border: none; background: transparent; color: var(--muted);
    font: inherit; font-size: 11px; padding: 4px 11px; border-radius: 999px; cursor: pointer;
  }
  .viewtoggle button.active { background: var(--accent); color: #fff; }

  /* Fill / full-bleed mode */
  .plate[data-mode="full"] { background: var(--mat); }
  .plate[data-mode="full"] .stage { position: absolute; inset: 0; padding: 0; }
  .plate[data-mode="full"] .stage img {
    width: 100%; height: 100%; max-width: none; aspect-ratio: auto;
    object-fit: cover; object-position: center 40%;
    -webkit-mask-image: none; mask-image: none;
  }
  .plate[data-mode="full"] .caption {
    position: absolute; left: 0; right: 0; bottom: 0; border-top: none; color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,.66), rgba(0,0,0,0));
    padding-block: 52px 16px;
  }
  .plate[data-mode="full"] .plate-no { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  .plate[data-mode="full"] .cat-pill { color: rgba(255,255,255,.88); }
  .plate[data-mode="full"] .descr { color: rgba(255,255,255,.82); text-shadow: 0 1px 6px rgba(0,0,0,.4); }

  /* mark toggles in the caption (wishlist / owned) */
  .marks { margin-left: auto; display: flex; gap: 8px; flex: none; }
  .mark {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: inherit; font-size: 12px;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
    transition: color .12s, border-color .12s, background .12s;
  }
  .mark:hover { border-color: var(--accent); color: var(--accent); }
  .mark.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .plate[data-mode="full"] .mark { background: rgba(0,0,0,.28); border-color: rgba(255,255,255,.4); color: #fff; }
  .plate[data-mode="full"] .mark.on { background: var(--accent); border-color: var(--accent); }

  /* ---- inventory strip (always visible, compact) ---- */
  .inventory {
    flex: none; border-bottom: 1px solid var(--line); background: var(--mat);
    position: relative; z-index: 20; /* keep hover popovers above the split below */
  }
  .inv-head {
    display: flex; align-items: center; gap: 12px;
    padding: 7px max(24px, env(safe-area-inset-right, 0px)) 4px max(24px, env(safe-area-inset-left, 0px));
  }
  .inv-title {
    font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-size: 16px; color: var(--ink);
  }
  /* segmented Wardrobe / Wishlist toggle + Aa font switcher */
  .inv-seg { display: inline-flex; gap: 3px; padding: 2px; border: 1px solid var(--line); border-radius: 999px; }
  .inv-seg button {
    border: none; background: transparent; color: var(--muted);
    font: inherit; font-size: 11px; padding: 3px 11px; border-radius: 999px; cursor: pointer;
  }
  .inv-seg button.active { background: var(--accent); color: #fff; }
  .inv-sub { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .inv-tiles {
    display: flex; flex-wrap: nowrap; align-items: stretch; gap: 0; min-height: 80px;
    padding: 2px max(24px, env(safe-area-inset-right, 0px)) 14px max(24px, env(safe-area-inset-left, 0px));
  }
  /* tiles share the full width equally, with dashed rules between them */
  .inv-tile {
    position: relative; flex: 1 1 0; min-width: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 0 10px; white-space: nowrap; cursor: default;
    border-left: 1px dashed color-mix(in srgb, var(--muted) 60%, transparent);
  }
  .inv-tile:first-child { border-left: none; }
  .inv-count-label {
    font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-size: 25px; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  /* hover popover: the garments in this tile, ordered as a colour spectrum */
  .inv-pop {
    display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    margin-top: 6px; z-index: 50; min-width: 150px; max-width: 240px; max-height: 50vh; overflow: auto;
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 7px;
  }
  .inv-tile:hover .inv-pop, .inv-tile:focus-within .inv-pop { display: block; }
  .inv-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
  .inv-popitem {
    display: flex; align-items: center; gap: 9px; padding: 4px 6px; white-space: nowrap;
    font-family: "Archivo", system-ui, sans-serif; font-size: 13px; color: var(--ink);
  }
  .inv-sw {
    width: 15px; height: 15px; border-radius: 50%; flex: none;
    box-shadow: inset 0 0 0 1px rgba(128,128,128,.4);
  }
  .inv-empty {
    flex: 1; display: flex; align-items: center;
    font-family: "Bodoni Moda", Georgia, serif; font-style: italic; color: var(--muted); font-size: 15px;
  }

  @media (prefers-reduced-motion: reduce) {
    .stage img, .cats button, .stepper button, .theme, .plate { transition: none; }
    .inv-caret { transition: none; }
  }

  /* ---- narrow ---- */
  @media (max-width: 760px) {
    .app { height: auto; min-height: 100%; }
    .split { grid-template-columns: 1fr; }
    .panel { border-right: none; border-bottom: 1px solid var(--line); }
    .panel-scroll { overflow: visible; }
    .plate { min-height: 68vh; }
    .wordmark { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="mast-left">
      <h1 class="wordmark">Wardrobe</h1>
      <span class="tagline">a tailoring lookbook</span>
    </div>
    <div class="mast-right">
      <span class="folio" id="folio">—</span>
      <button class="theme" id="themeBtn" aria-label="Switch light or dark">◐</button>
    </div>
  </header>

  <section class="inventory" id="inventory" aria-label="Wardrobe inventory">
    <div class="inv-head">
      <span class="inv-title">Inventory</span>
      <div class="inv-seg" id="invSeg" role="group" aria-label="Inventory view">
        <button type="button" data-view="wardrobe" class="active">Wardrobe</button>
        <button type="button" data-view="wishlist">Wishlist</button>
      </div>
      <span class="inv-sub" id="invSub"></span>
    </div>
    <div class="inv-tiles" id="invTiles"></div>
  </section>

  <main class="split">
    <section class="panel" aria-label="Outfit controls">
      <div class="panel-scroll">
        <div class="search">
          <input id="search" type="search" placeholder="Search a colour or plate…" autocomplete="off">
        </div>
        <nav class="cats" id="cats" aria-label="Category">
          <button data-cat="All" class="active">All</button>
          <button data-cat="Locked">Locked</button>
          <button data-cat="Potential">Potential</button>
          <button data-cat="Doubtful">Doubtful</button>
          <button data-cat="Wishlist" id="catWishlist">Wishlist</button>
          <button data-cat="Owned" id="catOwned">Owned</button>
          <button data-cat="Alternatives" id="catAlt">Alternatives</button>
          <button data-cat="Custom" id="catCustom">Custom</button>
        </nav>
        <button class="addbtn" id="addBtn" type="button">+ Add outfit</button>
        <div id="controls"></div>
      </div>
      <footer class="stepper">
        <button id="prev" type="button">‹ Prev</button>
        <span class="count"><span id="idx">0</span> / <span id="total">0</span></span>
        <button id="next" type="button">Next ›</button>
      </footer>
    </section>

    <section class="plate" id="plate" aria-label="Outfit image">
      <div class="viewtoggle" id="viewToggle" role="group" aria-label="Image fit">
        <button type="button" data-mode="fit" class="active" title="Framed on a color field">Fit</button>
        <button type="button" data-mode="full" title="Full-bleed magazine">Fill</button>
      </div>
      <div class="stage">
        <img id="photo" alt="">
        <div class="swatchcard" id="swatchCard" aria-label="Outfit colours"></div>
        <div class="empty">No outfit matches that.</div>
      </div>
      <figcaption class="caption">
        <span class="plate-no" id="plateNo">—</span>
        <span class="cat-pill" id="catPill"></span>
        <span class="cat-pill alt-tag" id="altTag">Alternative</span>
        <span class="descr" id="descr"></span>
        <span class="marks">
          <button class="mark" id="wishBtn" type="button" aria-pressed="false">♡ Wishlist</button>
          <button class="mark" id="ownBtn" type="button" aria-pressed="false">✓ In wardrobe</button>
          <button class="mark edit" id="editBtn" type="button">✎ Edit</button>
          <button class="mark del" id="delBtn" type="button">✕ Delete</button>
        </span>
      </figcaption>
    </section>
  </main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Add outfit">
  <div class="modal-card">
    <h2 class="modal-title" id="modalTitle">Add outfit</h2>
    <div id="modalFields"></div>
    <div class="mf-photo">
      <img id="mfThumb" alt="attached photo preview">
      <input type="file" id="mfFile" accept="image/*" aria-label="Attach a photo">
      <button type="button" class="mark del" id="mfPhotoClear" style="display:none">remove photo</button>
    </div>
    <div class="mf-err" id="mfErr"></div>
    <div class="mf-actions">
      <button type="button" id="mfCancel">Cancel</button>
      <button type="button" class="primary" id="mfSave">Save to wishlist</button>
    </div>
  </div>
</div>

<script>window.OUTFITS = {{ outfits|tojson }};</script>
<script>
(function () {
  var OUTFITS = window.OUTFITS || [];
  var SLOTS = [
    { key: "shirt",   label: "Shirt",   color: "shirt_color",   hex: "shirt_hex",
      pattern: "shirt_pattern", accent: "shirt_accent_color", accentHex: "shirt_accent_hex" },
    { key: "trouser", label: "Trouser", color: "trouser_color", hex: "trouser_hex" },
    { key: "belt",    label: "Belt",    color: "belt_color",    hex: "belt_hex" },
    { key: "shoe",    label: "Shoe",    color: "shoe_color",    hex: "shoe_hex" },
    { key: "dial",    label: "Dial",    color: "dial_color",    hex: "dial_hex" },
    { key: "strap",   label: "Strap",   color: "strap_color",   hex: "strap_hex" }
  ];
  var SLOTMAP = {}; SLOTS.forEach(function (s) { SLOTMAP[s.key] = s; });
  var GROUPS = [
    { title: "Ensemble", keys: ["shirt", "trouser", "belt", "shoe"] },
    { title: "Timepiece", keys: ["dial", "strap"] }
  ];
  // Allowed pattern names; "Solid" is the default (no pattern). swatchStyle() draws the rest.
  var PATTERNS = ["Solid", "Stripe", "Micro Check", "Gingham", "Windowpane", "Dots"];
  var DEFAULT_ACCENT = "#4a6fa5";   // denim blue, the starting accent for a new pattern
  var DEFAULT_ACCENT_NAME = "Blue"; // starting accent name, shown in the label until edited

  var state = {
    cat: "All", q: "", currentId: OUTFITS.length ? OUTFITS[0].combo_id : null,
    lock: null,                          // null | { key, val }
    wardrobeItems: {}, wishlistItems: {}, // item keys -> true (garments owned / wanted)
    patterns: {},                        // "combo_id|slot" -> { pattern, accent, accentHex } overrides
    custom: [],                          // user-created outfits (also merged into OUTFITS)
    invView: "wardrobe"                  // which set the inventory shows
  };
  var els = {};

  // ---- item model: a garment is (slot, colour) [+ shoe_type] [+ pattern + accent]; outfits bulk-add --
  // A patterned garment (e.g. a white shirt with a blue micro-check) carries an optional pattern name
  // and accent colour. Solids have no pattern and behave exactly as before (same key, label, swatch).
  function patternOf(slotKey, o) {
    var s = SLOTMAP[slotKey];
    if (!s.pattern) return null;                       // slot doesn't support patterns
    var pat = o[s.pattern];                             // a pattern baked into the outfit data wins
    if (pat && pat !== "Solid") {
      return { pattern: pat, accent: o[s.accent] || "", accentHex: o[s.accentHex] || "" };
    }
    var ov = state.patterns[o.combo_id + "|" + slotKey];   // else a per-outfit override set in the panel
    if (ov && ov.pattern && ov.pattern !== "Solid") {
      return { pattern: ov.pattern, accent: ov.accent || "", accentHex: ov.accentHex || "" };
    }
    return null;                                        // solid
  }
  function garmentLabel(slotKey, o) {
    var s = SLOTMAP[slotKey], base = o[s.color];
    if (slotKey === "shoe" && o.shoe_type) base += " " + o.shoe_type;
    var pat = patternOf(slotKey, o);                   // "White · Blue Micro Check"
    if (pat) base += (pat.accent ? " · " + pat.accent : "") + " " + pat.pattern;
    return base;
  }
  function itemKey(slotKey, o) {
    var s = SLOTMAP[slotKey], k = slotKey + "|" + o[s.color];
    if (slotKey === "shoe" && o.shoe_type) k += "|" + o.shoe_type;
    var pat = patternOf(slotKey, o);                   // distinct identity for a patterned garment
    if (pat) k += "|" + pat.pattern + "|" + pat.accent;
    return k;
  }
  // A garment per filled slot. Slots left blank (e.g. the watch on a custom outfit) are skipped,
  // so they don't become empty "dial|" garments or block outfitOwned/outfitWished.
  function itemsOf(o) {
    return SLOTS.filter(function (s) { return o[s.color]; }).map(function (s) { return itemKey(s.key, o); });
  }

  // A CSS background for a garment swatch: the ground colour for solids, a pattern overlay in the
  // accent colour otherwise. Falls back to the ground colour for any pattern name it doesn't draw.
  function swatchStyle(baseHex, pattern, accentHex) {
    var base = baseHex || "#888";
    if (!pattern || pattern === "Solid" || !accentHex) return base;
    var a = accentHex;
    switch (pattern) {
      case "Dots":
        return "radial-gradient(" + a + " 28%, transparent 30%) 0 0 / 5px 5px, " + base;
      case "Stripe":
        return "repeating-linear-gradient(90deg, " + a + " 0 1.5px, transparent 1.5px 5px), " + base;
      case "Micro Check":
      case "Gingham":
        return "repeating-linear-gradient(0deg, " + a + " 0 1px, transparent 1px 4px)," +
               "repeating-linear-gradient(90deg, " + a + " 0 1px, transparent 1px 4px), " + base;
      case "Windowpane":
        return "repeating-linear-gradient(0deg, " + a + " 0 1px, transparent 1px 8px)," +
               "repeating-linear-gradient(90deg, " + a + " 0 1px, transparent 1px 8px), " + base;
      default:
        return base;
    }
  }

  // One display record per distinct garment, for the hover popovers (colour + optional pattern).
  // Rebuilt whenever pattern overrides change, since a pattern alters a garment's identity (itemKey).
  var ITEM_INFO = {};
  function buildItemInfo() {
    for (var old in ITEM_INFO) delete ITEM_INFO[old];
    OUTFITS.forEach(function (o) {
      SLOTS.forEach(function (s) {
        var k = itemKey(s.key, o);
        if (!ITEM_INFO[k]) {
          var pat = patternOf(s.key, o);
          ITEM_INFO[k] = {
            slot: s.key, hex: o[s.hex],
            pattern: pat ? pat.pattern : "", accentHex: pat ? pat.accentHex : "",
            label: garmentLabel(s.key, o)
          };
        }
      });
    });
  }
  buildItemInfo();
  function hexToHsl(hex) {
    hex = String(hex || "").replace("#", "");
    if (hex.length === 3) hex = hex.replace(/./g, "$&$&");
    if (hex.length < 6) return [0, 0, 0.5];
    var r = parseInt(hex.substr(0, 2), 16) / 255,
        g = parseInt(hex.substr(2, 2), 16) / 255,
        b = parseInt(hex.substr(4, 2), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, h = 0, l = (max + min) / 2;
    var s = d === 0 ? 0 : (l > 0.5 ? d / (2 - max - min) : d / (max + min));
    if (d !== 0) {
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  // Order a set of garments into a natural spectrum: neutrals (low saturation) first by
  // lightness, then chromatic colours around the hue wheel, then by lightness.
  function spectrumSort(items) {
    return items.slice().sort(function (a, b) {
      var A = hexToHsl(a.hex), B = hexToHsl(b.hex);
      var aN = A[1] < 0.15, bN = B[1] < 0.15;
      if (aN !== bN) return aN ? -1 : 1;
      if (aN) return A[2] - B[2];
      return A[0] - B[0] || A[2] - B[2];
    });
  }

  // Each garment maps to a set of *holders* — the outfits (by combo_id) plus a "manual" sentinel
  // that keep it in the set. A garment is present iff its holder set is non-empty; removing one
  // holder drops the garment only when it was the last. (So removing one of two outfits that share
  // a garment leaves the garment — and the other outfit — intact.) An empty holder object is
  // truthy, so we always delete the key when its last holder goes.
  function setOf(which) { return which === "wardrobe" ? state.wardrobeItems : state.wishlistItems; }
  function addItemWardrobe(k, by) {                                   // own wins: drop all wish holders
    delete state.wishlistItems[k];
    (state.wardrobeItems[k] || (state.wardrobeItems[k] = {}))[by || "manual"] = true;
  }
  function addItemWishlist(k, by) {                                   // skip if already owned
    if (state.wardrobeItems[k]) return;
    (state.wishlistItems[k] || (state.wishlistItems[k] = {}))[by || "manual"] = true;
  }
  function removeItemHolder(k, which, by) {                           // drop one holder; delete if last
    var set = setOf(which), holders = set[k];
    if (!holders) return;
    delete holders[by];
    if (!Object.keys(holders).length) delete set[k];
  }
  function removeItemHard(k, which) { delete setOf(which)[k]; }       // drop the garment outright

  function addOutfitWardrobe(o)   { itemsOf(o).forEach(function (k) { addItemWardrobe(k, o.combo_id); }); }
  function addOutfitWishlist(o)   { itemsOf(o).forEach(function (k) { addItemWishlist(k, o.combo_id); }); }
  function removeOutfitWardrobe(o){ itemsOf(o).forEach(function (k) { removeItemHolder(k, "wardrobe", o.combo_id); }); }
  function removeOutfitWishlist(o){ itemsOf(o).forEach(function (k) { removeItemHolder(k, "wishlist", o.combo_id); }); }

  // Pills are outfit-level: an outfit is Owned / Wished only if the user added *that outfit*, i.e.
  // its combo_id is a holder on every one of its garments. Own-wins wipes a garment's wishlist
  // holders when owned, so an explicitly wished outfit is inherently not owned.
  function outfitOwned(o)  { var id = o.combo_id; return itemsOf(o).every(function (k) { var h = state.wardrobeItems[k]; return h && h[id]; }); }
  function outfitWished(o) { var id = o.combo_id; return itemsOf(o).every(function (k) { var h = state.wishlistItems[k]; return h && h[id]; }); }
  // Composable from owned garments (any holder); an Alternative is composable but not added as an
  // outfit itself — e.g. garments from two added outfits happen to form a third outfit.
  function outfitComposable(o) { return itemsOf(o).every(function (k) { return state.wardrobeItems[k]; }); }
  function outfitAlternative(o) { return !outfitOwned(o) && outfitComposable(o); }

  // A toggle changed: save, rebuild inventory, re-render controls.
  function afterChange() { persist(); buildInventory(); render(false); }

  // Set (or clear) the pattern override for the *current outfit's* garment in `slotKey`, keyed by
  // combo_id so a patterned and a plain shirt of the same colour can coexist across outfits. The
  // pattern (name + accent) renames the garment's identity (itemKey), so this outfit's owned /
  // wishlisted holder is carried from the old key to the new one — you don't lose the shirt.
  function setPattern(slotKey, pattern, accent, accentHex) {
    var cur = current(); if (!cur) return;
    var mapKey = cur.combo_id + "|" + slotKey;
    var okey = itemKey(slotKey, cur);                  // identity before
    if (!pattern || pattern === "Solid") {
      delete state.patterns[mapKey];
    } else {
      state.patterns[mapKey] = {
        pattern: pattern,
        accent: accent || DEFAULT_ACCENT_NAME,
        accentHex: accentHex || DEFAULT_ACCENT
      };
    }
    var nkey = itemKey(slotKey, cur);                  // identity after
    if (nkey !== okey) {                               // move only *this outfit's* holder to the new id
      ["wardrobeItems", "wishlistItems"].forEach(function (which) {
        var set = state[which], h = set[okey];
        if (h && h[cur.combo_id]) {
          delete h[cur.combo_id];
          if (!Object.keys(h).length) delete set[okey];
          (set[nkey] || (set[nkey] = {}))[cur.combo_id] = true;
        }
      });
    }
    buildItemInfo();
    afterChange();
  }

  // Category / search / wishlist / owned filter (everything except the lock).
  function basePool() {
    return OUTFITS.filter(function (o) {
      if (state.cat === "Wishlist") { if (!outfitWished(o)) return false; }
      else if (state.cat === "Owned") { if (!outfitOwned(o)) return false; }
      else if (state.cat === "Alternatives") { if (!outfitAlternative(o)) return false; }
      else if (state.cat !== "All" && o.category !== state.cat) return false;
      if (state.q) {
        var hay = [o.combo_id, o.shirt_color, o.shirt_pattern, o.shirt_accent_color,
                   o.trouser_color, o.belt_color,
                   o.shoe_color, o.dial_color, o.strap_color].join(" ").toLowerCase();
        if (hay.indexOf(state.q) === -1) return false;
      }
      return true;
    });
  }
  // basePool constrained by the lock (a hard filter on one slot).
  function pool() {
    var p = basePool();
    if (state.lock) {
      var col = SLOTMAP[state.lock.key].color;
      p = p.filter(function (o) { return o[col] === state.lock.val; });
    }
    return p;
  }
  function current(p) { p = p || pool(); return p.find(function (o) { return o.combo_id === state.currentId; }) || p[0]; }
  function score(o, cur) { return SLOTS.reduce(function (n, s) { return n + (o[s.color] === cur[s.color] ? 1 : 0); }, 0); }

  function onPick(key, val) {
    // Re-aiming the locked slot: move the lock to the new value, then pick within the new pool.
    if (state.lock && state.lock.key === key) {
      state.lock.val = val;
      var lp = pool(), lcur = current();
      var lc = lp.slice().sort(function (a, b) {
        return score(b, lcur) - score(a, lcur) || (a.combo_id < b.combo_id ? -1 : 1);
      });
      if (lc.length) state.currentId = lc[0].combo_id;
      render(true);
      return;
    }
    var s = SLOTMAP[key], p = pool(), cur = current(p);
    var cands = p.filter(function (o) { return o[s.color] === val; });
    if (!cands.length) return;
    cands.sort(function (a, b) {
      return score(b, cur) - score(a, cur) || (a.combo_id < b.combo_id ? -1 : 1);
    });
    state.currentId = cands[0].combo_id;
    render(true);
  }
  function toggleLock(key) {
    if (state.lock && state.lock.key === key) { state.lock = null; }
    else {
      var cur = current();
      if (!cur) return;
      state.lock = { key: key, val: cur[SLOTMAP[key].color] };
    }
    render(false);
  }
  function step(d) {
    var p = pool(); if (!p.length) return;
    var i = p.findIndex(function (o) { return o.combo_id === state.currentId; });
    if (i < 0) i = 0;
    i = (i + d + p.length) % p.length;
    state.currentId = p[i].combo_id; render(true);
  }

  function buildControls() {
    var host = document.getElementById("controls");
    GROUPS.forEach(function (g) {
      var h = document.createElement("div"); h.className = "grp"; h.textContent = g.title; host.appendChild(h);
      g.keys.forEach(function (key) {
        var s = SLOTMAP[key];
        var row = document.createElement("div"); row.className = "row";
        row.innerHTML = '<span class="dot"></span><label>' + s.label +
          '</label><span class="sel"><select aria-label="' + s.label + ' colour"></select></span>' +
          '<span class="hex"></span>' +
          '<span class="rowacts">' +
            '<button class="wishbtn" type="button" aria-label="Wishlist this ' + s.label +
              '" title="Add this garment to the wishlist">♡</button>' +
            '<button class="ownbtn" type="button" aria-label="Add this ' + s.label +
              ' to the wardrobe" title="Add this garment to the wardrobe">✓</button>' +
            '<button class="lockbtn" type="button" aria-label="Lock ' + s.label +
              '" title="Lock this field to constrain the others">🔓</button>' +
          '</span>';
        host.appendChild(row);
        var sel = row.querySelector("select");
        sel.addEventListener("change", function (e) { onPick(key, e.target.value); });
        var lockEl = row.querySelector(".lockbtn");
        lockEl.addEventListener("click", function () { toggleLock(key); });
        var wishEl = row.querySelector(".wishbtn"), ownEl = row.querySelector(".ownbtn");
        // ♡ / ✓ act on the garment currently shown in this row.
        wishEl.addEventListener("click", function () {
          var k = itemKey(key, current());
          if (state.wishlistItems[k]) removeItemHard(k, "wishlist"); else addItemWishlist(k);
          afterChange();
        });
        ownEl.addEventListener("click", function () {
          var k = itemKey(key, current());
          if (state.wardrobeItems[k]) removeItemHard(k, "wardrobe"); else addItemWardrobe(k);
          afterChange();
        });
        els[key] = { row: row, dot: row.querySelector(".dot"), sel: sel,
                     hex: row.querySelector(".hex"), lock: lockEl, wish: wishEl, own: ownEl };

        // Pattern-capable slots (e.g. Shirt) get a second line: pattern + accent colour.
        if (s.pattern) {
          var pat = document.createElement("div"); pat.className = "patline";
          pat.innerHTML = '<span class="patlabel">Pattern</span>' +
            '<span class="sel sel-pat"><select class="patsel" aria-label="' + s.label +
              ' pattern">' +
              PATTERNS.map(function (p) { return '<option>' + p + '</option>'; }).join("") +
            '</select></span>' +
            '<input type="color" class="patacc" aria-label="' + s.label +
              ' accent colour" value="' + DEFAULT_ACCENT + '">' +
            '<input type="text" class="patname" aria-label="' + s.label +
              ' accent name" placeholder="accent name">';
          row.appendChild(pat);
          var patSel = pat.querySelector(".patsel"), patAcc = pat.querySelector(".patacc"),
              patName = pat.querySelector(".patname");
          var applyPat = function () { setPattern(key, patSel.value, patName.value.trim(), patAcc.value); };
          patSel.addEventListener("change", applyPat);
          patAcc.addEventListener("input", applyPat);
          patName.addEventListener("change", applyPat);   // on blur/enter, not every keystroke
          els[key].patSel = patSel; els[key].patAcc = patAcc; els[key].patName = patName;
        }
      });
    });
  }

  function render(swap) {
    var p = pool();
    var plate = document.getElementById("plate");
    if (!p.length) {
      plate.classList.add("is-empty"); plate.classList.remove("is-card");
      document.getElementById("folio").textContent = "—";
      document.getElementById("idx").textContent = "0";
      document.getElementById("total").textContent = "0";
      // Clear the controls so a now-gone outfit's colours don't linger in the Ensemble selects.
      SLOTS.forEach(function (s) {
        var el = els[s.key];
        el.sel.innerHTML = ""; el.dot.style.background = "transparent"; el.hex.textContent = "";
        if (el.patSel) { el.patSel.value = "Solid"; el.patName.value = ""; }
      });
      document.getElementById("editBtn").style.display = "none";
      document.getElementById("delBtn").style.display = "none";
      updateChips();
      return;
    }
    plate.classList.remove("is-empty");
    var cur = current(p); state.currentId = cur.combo_id;
    var bp = basePool();

    SLOTS.forEach(function (s) {
      var el = els[s.key];
      var locked = state.lock && state.lock.key === s.key;
      // The locked slot draws options from the unlocked set so its value stays changeable;
      // every other slot's options come from the locked subset.
      var opts = locked ? bp : p;
      var seen = {}, vals = [];
      opts.forEach(function (o) { if (!(o[s.color] in seen)) { seen[o[s.color]] = 1; vals.push([o[s.color], o[s.hex]]); } });
      vals.sort(function (a, b) { return a[0].localeCompare(b[0]); });
      el.sel.innerHTML = vals.map(function (v) {
        return '<option value="' + v[0] + '">' + v[0] + "</option>";
      }).join("");
      el.sel.value = locked ? state.lock.val : cur[s.color];
      var curPat = patternOf(s.key, cur);
      el.dot.style.background = swatchStyle(cur[s.hex], curPat && curPat.pattern, curPat && curPat.accentHex);
      // Reflect the current garment's pattern override in its row's pattern controls.
      if (el.patSel) {
        el.patSel.value = curPat ? curPat.pattern : "Solid";
        if (curPat && curPat.accentHex) el.patAcc.value = curPat.accentHex;
        el.patName.value = curPat ? (curPat.accent || "") : "";
        var isSolid = el.patSel.value === "Solid";
        el.patAcc.disabled = isSolid; el.patName.disabled = isSolid;
        el.patAcc.style.opacity = isSolid ? ".4" : "1";
        el.patName.style.opacity = isSolid ? ".4" : "1";
      }
      var hx = cur[s.hex] || "";
      if (s.key === "shoe" && cur.shoe_type) hx = cur.shoe_type + " · " + hx;
      el.hex.textContent = hx;
      el.lock.textContent = locked ? "🔒" : "🔓";
      el.lock.classList.toggle("on", !!locked);
      el.row.classList.toggle("is-locked", !!locked);
      // ♡ / ✓ reflect whether the shown garment is wished / owned
      var k = itemKey(s.key, cur);
      el.wish.classList.toggle("on", !!state.wishlistItems[k]);
      el.own.classList.toggle("on", !!state.wardrobeItems[k]);
    });

    // wishlist / owned toggles for the whole current outfit (derived from its garments)
    var wb = document.getElementById("wishBtn"), ob = document.getElementById("ownBtn");
    var isWish = outfitWished(cur), isOwn = outfitOwned(cur);
    wb.classList.toggle("on", isWish); wb.setAttribute("aria-pressed", isWish);
    ob.classList.toggle("on", isOwn); ob.setAttribute("aria-pressed", isOwn);
    // "Alternative": you own every garment but didn't add this outfit — click ✓ to claim it.
    document.getElementById("altTag").classList.toggle("on", !isOwn && outfitComposable(cur));
    updateChips();

    if (cur.amb_hex) plate.style.setProperty("--amb", cur.amb_hex);

    // A custom outfit with no attached photo shows the generated colour card instead of the <img>.
    var img = document.getElementById("photo");
    if (cur.custom && !cur.img) {
      plate.classList.add("is-card");
      document.getElementById("swatchCard").innerHTML = buildSwatchCard(cur);
      img.onload = null;
    } else {
      plate.classList.remove("is-card");
      if (swap && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        img.style.opacity = 0;
        img.onload = function () { img.style.opacity = 1; };
      } else { img.onload = null; img.style.opacity = 1; }
      img.src = cur.img; img.alt = cur.combo_id + " outfit";
    }

    // Edit / Delete only for user-created outfits.
    document.getElementById("editBtn").style.display = cur.custom ? "inline-flex" : "none";
    document.getElementById("delBtn").style.display = cur.custom ? "inline-flex" : "none";

    document.getElementById("plateNo").textContent = cur.combo_id;
    var pill = document.getElementById("catPill");
    pill.textContent = cur.category; pill.className = "cat-pill is-" + cur.category;
    document.getElementById("descr").textContent =
      garmentLabel("shirt", cur) + " shirt · " + cur.trouser_color + " trouser · " +
      cur.shoe_color + " " + (cur.shoe_type ? cur.shoe_type.toLowerCase() : "shoe");

    var i = p.findIndex(function (o) { return o.combo_id === cur.combo_id; });
    document.getElementById("idx").textContent = i + 1;
    document.getElementById("total").textContent = p.length;
    document.getElementById("folio").textContent =
      String(i + 1).padStart(2, "0") + " / " + String(p.length).padStart(2, "0");
  }

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }
  function updateChips() {
    var w = 0, ow = 0, alt = 0;
    OUTFITS.forEach(function (o) {
      if (outfitWished(o)) w++;
      if (outfitOwned(o)) ow++;
      else if (outfitComposable(o)) alt++;
    });
    document.getElementById("catWishlist").textContent = "Wishlist (" + w + ")";
    document.getElementById("catOwned").textContent = "Owned (" + ow + ")";
    document.getElementById("catAlt").textContent = "Alternatives (" + alt + ")";
  }
  // Serialise a holder map { key: {holder:true,...} } to { key: [holder,...] } for the API.
  function toKeyed(map) {
    var out = {};
    Object.keys(map).forEach(function (k) { out[k] = Object.keys(map[k]); });
    return out;
  }
  function persist() {
    try {
      fetch("/api/state", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          wardrobe: toKeyed(state.wardrobeItems),
          wishlist: toKeyed(state.wishlistItems),
          patterns: state.patterns,
          custom: state.custom
        })
      });
    } catch (e) {}
  }
  // Count-only inventory tiles ("Shirts · 6"), one per garment type, for the active set.
  function buildInventory() {
    var tiles = document.getElementById("invTiles"), sub = document.getElementById("invSub");
    var set = state.invView === "wishlist" ? state.wishlistItems : state.wardrobeItems;
    var total = 0, html = "";
    SLOTS.forEach(function (s) {
      var keys = Object.keys(set).filter(function (k) { return k.split("|")[0] === s.key; });
      var n = keys.length; if (!n) return; total += n;
      var infos = spectrumSort(keys.map(function (k) { return ITEM_INFO[k]; }).filter(Boolean));
      var rows = infos.map(function (it) {
        return '<span class="inv-popitem"><span class="inv-sw" style="background:' +
          swatchStyle(it.hex, it.pattern, it.accentHex) + '"></span>' + esc(it.label) + "</span>";
      }).join("");
      html += '<div class="inv-tile" tabindex="0"><span class="inv-count-label">' +
        s.label + "s · " + n + '</span><div class="inv-pop">' + rows + "</div></div>";
    });
    if (!total) {
      tiles.innerHTML = '<span class="inv-empty">' +
        (state.invView === "wishlist" ? "Nothing wishlisted yet." : "Nothing in your wardrobe yet.") +
        "</span>";
      sub.textContent = "";
      return;
    }
    tiles.innerHTML = html;
    sub.textContent = total + " garment" + (total === 1 ? "" : "s");
  }

  // category
  document.getElementById("cats").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    this.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    b.classList.add("active"); state.cat = b.dataset.cat; render(false);
  });
  // search
  document.getElementById("search").addEventListener("input", function (e) {
    state.q = e.target.value.trim().toLowerCase(); render(false);
  });
  // stepper + keys
  document.getElementById("prev").addEventListener("click", function () { step(-1); });
  document.getElementById("next").addEventListener("click", function () { step(1); });
  document.addEventListener("keydown", function (e) {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
    else if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
  });
  // theme
  var root = document.documentElement, saved = null;
  try { saved = localStorage.getItem("wl-theme"); } catch (e) {}
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").addEventListener("click", function () {
    var isDark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    var next = isDark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("wl-theme", next); } catch (e) {}
  });

  // image-fit toggle (Fit / Fill)
  var plateEl = document.getElementById("plate");
  var vt = document.getElementById("viewToggle");
  function setMode(m) {
    m = m === "full" ? "full" : "fit";
    if (m === "full") plateEl.setAttribute("data-mode", "full");
    else plateEl.removeAttribute("data-mode");
    vt.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.mode === m);
    });
    try { localStorage.setItem("wl-fit", m); } catch (e) {}
  }
  vt.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) setMode(b.dataset.mode);
  });
  var savedFit = null; try { savedFit = localStorage.getItem("wl-fit"); } catch (e) {}
  setMode(savedFit === "full" ? "full" : "fit");

  // whole-outfit wishlist / wardrobe toggles (bulk-add this outfit's garments)
  document.getElementById("wishBtn").addEventListener("click", function () {
    var o = current(); if (!o) return;
    if (outfitWished(o)) removeOutfitWishlist(o); else addOutfitWishlist(o);
    afterChange();
  });
  document.getElementById("ownBtn").addEventListener("click", function () {
    var o = current(); if (!o) return;
    if (outfitOwned(o)) removeOutfitWardrobe(o); else addOutfitWardrobe(o);
    afterChange();
  });

  // inventory: Wardrobe / Wishlist view toggle
  document.getElementById("invSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    this.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
    b.classList.add("active"); state.invView = b.dataset.view; buildInventory();
  });
  // ---- custom (user-created) outfits ----------------------------------------------------------
  // The generated colour card shown in the plate when a custom outfit has no attached photo.
  function buildSwatchCard(o) {
    var html = "";
    GROUPS.forEach(function (g, gi) {
      var rows = "";
      g.keys.forEach(function (key) {
        var s = SLOTMAP[key];
        if (!o[s.color]) return;                      // skip blank slots (e.g. an omitted watch)
        var pat = patternOf(key, o);
        var bg = swatchStyle(o[s.hex], pat && pat.pattern, pat && pat.accentHex);
        rows += '<div class="sc-row"><span class="sc-sw" style="background:' + bg + '"></span>' +
          '<span class="sc-slot">' + s.label + '</span>' +
          '<span class="sc-name">' + esc(garmentLabel(key, o)) + '</span></div>';
      });
      if (rows && gi > 0) html += '<div class="sc-div">' + g.title + '</div>';
      html += rows;
    });
    return html || '<div class="sc-row"><span class="sc-name">No colours set.</span></div>';
  }

  function nextCustomId() {
    var max = 0;
    OUTFITS.forEach(function (o) {
      var m = /^U-(\d+)$/.exec(o.combo_id || "");
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
    return "U-" + String(max + 1).padStart(3, "0");
  }

  var editingId = null, pendingImg = "";
  function gf(id) { var e = document.getElementById(id); return e ? e.value : ""; }
  function sf(id, v) { var e = document.getElementById(id); if (e) e.value = v; }
  // Normalise typed hex ("4a6fa5", "#ABC", "#4a6fa5") to "#rrggbb", or null if not a valid hex.
  function normHex(v) {
    v = String(v || "").trim().replace(/^#/, "");
    if (/^[0-9a-fA-F]{3}$/.test(v)) v = v.replace(/./g, "$&$&");
    return /^[0-9a-fA-F]{6}$/.test(v) ? "#" + v.toLowerCase() : null;
  }

  // Build the form fields once, generated from SLOTS (watch group under an optional divider).
  function buildModalFields() {
    var html = "";
    GROUPS.forEach(function (g, gi) {
      if (gi > 0) html += '<div class="mf-div">' + g.title + ' (optional)</div>';
      g.keys.forEach(function (key) {
        var s = SLOTMAP[key];
        html += '<div class="mf-row"><label>' + s.label + '</label>' +
          '<input type="text" id="mf-' + key + '-name" placeholder="colour name" autocomplete="off">' +
          '<input type="text" class="mf-hex" id="mf-' + key + '-hextext" data-hexfor="mf-' + key +
            '-hex" placeholder="#rrggbb" autocomplete="off" spellcheck="false" aria-label="' + s.label + ' hex">' +
          '<input type="color" id="mf-' + key + '-hex" value="#cccccc" data-textid="mf-' + key +
            '-hextext" aria-label="' + s.label + ' colour swatch"></div>';
        if (key === "shoe") {
          html += '<div class="mf-sub"><span class="patlabel">Type</span>' +
            '<input type="text" id="mf-shoe-type" class="patname" placeholder="e.g. Derby" autocomplete="off"></div>';
        }
        if (s.pattern) {
          html += '<div class="mf-sub"><span class="patlabel">Pattern</span>' +
            '<span class="sel sel-pat"><select id="mf-' + key + '-pat" aria-label="' + s.label + ' pattern">' +
              PATTERNS.map(function (p) { return '<option>' + p + '</option>'; }).join("") +
            '</select></span>' +
            '<input type="text" class="mf-hex" id="mf-' + key + '-acchextext" data-hexfor="mf-' + key +
              '-acchex" placeholder="#rrggbb" autocomplete="off" spellcheck="false" aria-label="accent hex">' +
            '<input type="color" id="mf-' + key + '-acchex" value="' + DEFAULT_ACCENT + '" data-textid="mf-' + key +
              '-acchextext" aria-label="accent colour swatch">' +
            '<input type="text" id="mf-' + key + '-accname" class="patname" placeholder="accent name" autocomplete="off"></div>';
        }
      });
    });
    document.getElementById("modalFields").innerHTML = html;
  }

  // Keep each hex text field and its colour swatch in sync (hex text is the source of truth).
  document.getElementById("modalFields").addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.hexfor) {                 // typed hex -> swatch
      var h = normHex(t.value);
      if (h) sf(t.dataset.hexfor, h);
    } else if (t.type === "color" && t.dataset && t.dataset.textid) {  // swatch -> hex text
      sf(t.dataset.textid, t.value);
    }
  });

  function updatePhotoThumb() {
    var t = document.getElementById("mfThumb"), clr = document.getElementById("mfPhotoClear");
    if (pendingImg) { t.src = pendingImg; t.classList.add("on"); clr.style.display = ""; }
    else { t.removeAttribute("src"); t.classList.remove("on"); clr.style.display = "none"; }
  }

  function openModal(o) {
    editingId = o ? o.combo_id : null;
    pendingImg = o && o.img ? o.img : "";
    document.getElementById("modalTitle").textContent = o ? "Edit outfit" : "Add outfit";
    document.getElementById("mfSave").textContent = o ? "Save changes" : "Save to wishlist";
    document.getElementById("mfErr").textContent = "";
    SLOTS.forEach(function (s) {
      sf("mf-" + s.key + "-name", o ? (o[s.color] || "") : "");
      var hex = (o && o[s.hex]) ? o[s.hex] : "#cccccc";
      sf("mf-" + s.key + "-hex", hex); sf("mf-" + s.key + "-hextext", hex);
      if (s.pattern) {
        sf("mf-" + s.key + "-pat", (o && o[s.pattern]) ? o[s.pattern] : "Solid");
        var ah = (o && o[s.accentHex]) ? o[s.accentHex] : DEFAULT_ACCENT;
        sf("mf-" + s.key + "-acchex", ah); sf("mf-" + s.key + "-acchextext", ah);
        sf("mf-" + s.key + "-accname", (o && o[s.accent]) ? o[s.accent] : "");
      }
    });
    sf("mf-shoe-type", (o && o.shoe_type) ? o.shoe_type : "Derby");
    updatePhotoThumb();
    document.getElementById("modal").classList.add("open");
  }
  function closeModal() { document.getElementById("modal").classList.remove("open"); }

  function readForm() {
    var o = { category: "Custom", custom: true };
    SLOTS.forEach(function (s) {
      var name = gf("mf-" + s.key + "-name").trim();
      if (!name) return;
      o[s.color] = name;
      o[s.hex] = normHex(gf("mf-" + s.key + "-hextext")) || gf("mf-" + s.key + "-hex");
      if (s.pattern) {
        var pat = gf("mf-" + s.key + "-pat");
        if (pat && pat !== "Solid") {
          o[s.pattern] = pat;
          o[s.accent] = gf("mf-" + s.key + "-accname").trim() || DEFAULT_ACCENT_NAME;
          o[s.accentHex] = normHex(gf("mf-" + s.key + "-acchextext")) || gf("mf-" + s.key + "-acchex");
        }
      }
    });
    var st = gf("mf-shoe-type").trim();
    if (st && o.shoe_color) o.shoe_type = st;
    o.amb_hex = o.shirt_hex || o.trouser_hex || "";
    o.img = pendingImg || "";
    return o;
  }

  function saveModal() {
    var o = readForm();
    var need = ["shirt", "trouser", "belt", "shoe"];
    for (var i = 0; i < need.length; i++) {
      var s = SLOTMAP[need[i]];
      if (!o[s.color]) {
        document.getElementById("mfErr").textContent = "Please set a colour for " + s.label + ".";
        return;
      }
    }
    if (editingId) {
      var oIdx = OUTFITS.findIndex(function (c) { return c.combo_id === editingId; });
      var cIdx = state.custom.findIndex(function (c) { return c.combo_id === editingId; });
      var old = OUTFITS[oIdx];
      var wasOwned = outfitOwned(old), wasWished = outfitWished(old);
      removeOutfitWardrobe(old); removeOutfitWishlist(old);   // drop holders under old identity
      o.combo_id = editingId;
      if (oIdx >= 0) OUTFITS[oIdx] = o;
      if (cIdx >= 0) state.custom[cIdx] = o;
      buildItemInfo();
      if (wasOwned) addOutfitWardrobe(o); else if (wasWished) addOutfitWishlist(o);
    } else {
      o.combo_id = nextCustomId();
      state.custom.push(o); OUTFITS.push(o);
      buildItemInfo();
      addOutfitWishlist(o);                                   // creating it wishlists it
      setCat("Custom");
    }
    state.currentId = o.combo_id;
    closeModal();
    afterChange();
  }

  function deleteCustom() {
    var o = current(); if (!o || !o.custom) return;
    removeOutfitWardrobe(o); removeOutfitWishlist(o);
    state.custom = state.custom.filter(function (c) { return c.combo_id !== o.combo_id; });
    var idx = OUTFITS.findIndex(function (c) { return c.combo_id === o.combo_id; });
    if (idx >= 0) OUTFITS.splice(idx, 1);
    buildItemInfo();
    state.currentId = null;                                   // render() falls back to first in pool
    if (!pool().length) { state.lock = null; setCat("All"); }  // don't strand on a now-empty filter
    afterChange();
  }

  function setCat(cat) {
    state.cat = cat;
    document.getElementById("cats").querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.cat === cat);
    });
  }

  // Downscale an attached photo to a 2:3 JPEG data URL (cover-crop, max ~1000px tall).
  document.getElementById("mfFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var im = new Image();
      im.onload = function () {
        var tAR = 2 / 3, H = Math.min(1000, im.naturalHeight || 1000), W = H * tAR;
        var cv = document.createElement("canvas"); cv.width = Math.round(W); cv.height = Math.round(H);
        var ctx = cv.getContext("2d");
        var sAR = im.naturalWidth / im.naturalHeight, sw, sh, sx, sy;
        if (sAR > tAR) { sh = im.naturalHeight; sw = sh * tAR; sx = (im.naturalWidth - sw) / 2; sy = 0; }
        else { sw = im.naturalWidth; sh = sw / tAR; sx = 0; sy = (im.naturalHeight - sh) / 2; }
        ctx.drawImage(im, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
        try { pendingImg = cv.toDataURL("image/jpeg", 0.82); } catch (err) { pendingImg = ""; }
        updatePhotoThumb();
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(f);
  });
  document.getElementById("mfPhotoClear").addEventListener("click", function () {
    pendingImg = ""; updatePhotoThumb();
  });
  document.getElementById("addBtn").addEventListener("click", function () { openModal(null); });
  document.getElementById("editBtn").addEventListener("click", function () {
    var o = current(); if (o && o.custom) openModal(o);
  });
  document.getElementById("mfCancel").addEventListener("click", closeModal);
  document.getElementById("mfSave").addEventListener("click", saveModal);
  document.getElementById("modal").addEventListener("click", function (e) {
    if (e.target === this) closeModal();   // click the backdrop to dismiss
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("modal").classList.contains("open")) closeModal();
  });
  // Delete: two-click confirm (no blocking dialog).
  (function () {
    var del = document.getElementById("delBtn"), armed = false, timer = null;
    del.addEventListener("click", function () {
      if (!armed) {
        armed = true; del.textContent = "✕ Confirm?";
        timer = setTimeout(function () { armed = false; del.textContent = "✕ Delete"; }, 3000);
        return;
      }
      clearTimeout(timer); armed = false; del.textContent = "✕ Delete";
      deleteCustom();
    });
  })();
  buildModalFields();

  buildControls();
  // Replay a persisted set through `add` (which enforces the own-wins / skip-owned rules).
  // `src` is either { key: [holders] } (current) or [key,...] (legacy, one "manual" holder).
  function hydrate(src, add) {
    if (!src) return;
    if (Array.isArray(src)) { src.forEach(function (k) { add(k, "manual"); }); return; }
    Object.keys(src).forEach(function (k) {
      var holders = src[k];
      if (Array.isArray(holders) && holders.length) holders.forEach(function (by) { add(k, by); });
      else add(k, "manual");
    });
  }
  // Load the persisted wardrobe / wishlist garments, then first inventory + render.
  function boot() { buildInventory(); render(false); }
  fetch("/api/state")
    .then(function (r) { return r.json(); })
    .then(function (st) {
      // Pattern overrides first, so garment identities (itemKeys) are final before holders hydrate.
      if (st && st.patterns && typeof st.patterns === "object") {
        Object.keys(st.patterns).forEach(function (k) {
          var v = st.patterns[k];
          if (v && typeof v.pattern === "string" && v.pattern && v.pattern !== "Solid") {
            state.patterns[k] = {
              pattern: v.pattern,
              accent: typeof v.accent === "string" ? v.accent : "",
              accentHex: String(v.accentHex || DEFAULT_ACCENT)
            };
          }
        });
      }
      // Custom outfits: merge into OUTFITS (same shape) so all machinery treats them as outfits.
      if (st && Array.isArray(st.custom)) {
        st.custom.forEach(function (c) {
          if (c && typeof c.combo_id === "string" && c.combo_id) {
            c.category = "Custom"; c.custom = true;
            state.custom.push(c); OUTFITS.push(c);
          }
        });
      }
      // Rebuild once now that both pattern overrides and custom outfits are in place, before holders.
      buildItemInfo();
      // Accept the current shape { key: [holders] } and the legacy flat array [key,...]
      // (one "manual" holder). Wardrobe wins, so seed it first and skip owned garments in wishlist.
      hydrate(st && st.wardrobe, function (k, by) { addItemWardrobe(k, by); });
      hydrate(st && st.wishlist, function (k, by) { addItemWishlist(k, by); });
    })
    .catch(function () {})
    .then(boot);
})();
</script>
</body>
